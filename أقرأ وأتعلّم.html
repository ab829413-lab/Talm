<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقرأ وأتعلّم</title>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff4d6;--bg2:#d9f0ff;--ink:#2b2d42;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2350;--bg2:#12304a;--ink:#f4f1ff;--card:#3a3470;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a2350;--bg2:#12304a;--ink:#f4f1ff;--card:#3a3470;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;font-weight:600;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;font-size:20px}
#app{max-width:880px;margin:auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:8px 0}
h1{font-family:'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;font-weight:400;font-size:2rem;margin:0;flex:1;text-align:center}
.bk,.st{background:var(--card);border:0;border-radius:50px;padding:8px 14px;font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.15);font-family:inherit;color:var(--ink)}
.hi{text-align:center;font-size:1.3rem;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{border:0;border-radius:26px;padding:18px 8px;font:800 1.25rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;color:#fff;background:hsl(var(--h) 75% 52%);box-shadow:0 6px 0 hsl(var(--h) 70% 38%);cursor:pointer;transition:transform .1s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 hsl(var(--h) 70% 38%)}
.tile i{display:block;font-style:normal;font-family:'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;font-size:3rem;line-height:1.3;margin-bottom:4px}
.big{background:var(--card);border:5px solid hsl(var(--h) 70% 60%);border-radius:30px;padding:16px;text-align:center;box-shadow:0 8px 0 hsl(var(--h) 60% 45% / .35);margin-bottom:14px}
.ltr{font:400 7rem/1.3 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;color:hsl(var(--h) 70% 45%);cursor:pointer}
.nm{font-size:1.5rem}.pic{font-size:6rem;line-height:1.2}
.wd{font-size:2.2rem;cursor:pointer}.fm{display:flex;gap:10px;justify-content:center;margin-top:8px}
.fm b{font:400 3rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;background:hsl(var(--h) 85% 92%);color:#222;border-radius:18px;padding:0 18px;cursor:pointer}
.chips,.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{width:50px;height:50px;border-radius:50%;border:3px solid hsl(var(--h) 70% 55%);background:var(--card);color:var(--ink);font:400 1.7rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;cursor:pointer}
.chip.on{background:hsl(var(--h) 75% 55%);color:#fff}
.tab{border:0;border-radius:50px;padding:9px 18px;font:800 1.05rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.tab.on{background:#ff6b6b;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.cd{background:var(--card);border-radius:22px;padding:12px 4px;text-align:center;font:400 2.6rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;border-bottom:6px solid hsl(var(--h) 70% 55%);cursor:pointer;color:hsl(var(--h) 65% 42%)}
.cd:active{transform:scale(.94)}
@media (prefers-color-scheme:dark){.cd{color:hsl(var(--h) 80% 75%)}}
.wc{grid-column:span 1;font-size:2.2rem}.wc .e{font-size:3.6rem;display:block}
.s0{color:#e63946}.s1{color:#2a9d8f}.s2{color:#e08a00}
.sent{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;font:600 1.7rem/2.2 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif}
.w{cursor:pointer;border-radius:10px;padding:0 4px;display:inline-block}.w.hl{background:#ffd166;color:#222}
.rd{border:0;background:#4cc9f0;color:#fff;border-radius:50px;padding:6px 16px;font:800 1rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;cursor:pointer;margin-inline-start:8px}
.sec{font-family:'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;font-size:1.6rem;margin:10px 0 6px}
.scene{border-radius:30px;padding:22px;text-align:center;margin-bottom:12px;color:#222}
.scene .e{font-size:7rem;line-height:1.3}.scene .t{font:800 1.9rem/2.1 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav .tab{flex:1;font-size:1.2rem}
svg{width:100%;max-width:520px;display:block;margin:auto;background:#bfe9ff;border-radius:24px;touch-action:manipulation}
svg .f{cursor:pointer;stroke:#444;stroke-width:3}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.pal button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer}
.q{text-align:center}.q .pic{font-size:8rem}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.opts button{min-width:100px;font:400 3rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;border:0;border-radius:24px;padding:6px 18px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.bad{animation:sh .3s;background:#ffb4b4!important}.good{background:#8ee6a0!important;color:#123!important}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.ok{background:#8ee6a0!important;color:#123}.no{background:#ffb4b4!important;color:#222}.opts2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.mic{font:800 1.5rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;border:0;border-radius:50px;padding:12px 26px;background:#ef476f;color:#fff;box-shadow:0 5px 0 #a8274a;cursor:pointer}.mic.on{animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.08)}}.res{font:800 1.5rem/1.8 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif;text-align:center;margin-top:12px;min-height:64px}.res small{font-size:1rem;font-weight:600}.forms{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.fo{background:hsl(var(--h) 85% 92%);color:#222;border-radius:16px;padding:0 14px;text-align:center}.fo b{display:block;font-size:2.6rem;line-height:1.4}.fo small{font-size:1rem}.nt{margin-top:6px;font-size:1.2rem;color:#c1121f}.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.sl{min-width:58px;height:72px;padding:0 6px;border-radius:16px;border:3px dashed #999;display:inline-flex;align-items:center;justify-content:center;font:400 2.6rem 'Scheherazade New','Noto Naskh Arabic',Tahoma,serif}.sl.fl{border:3px solid #2a9d8f;background:#d6f5e3;color:#123}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app');let st=0;
const LT=[['أ','أَلِف','أَرْنَبٌ','🐰'],['ب','بَاء','بَطَّةٌ','🦆'],['ت','تَاء','تُفَّاحَةٌ','🍎'],['ث','ثَاء','ثَعْلَبٌ','🦊'],['ج','جِيم','جَمَلٌ','🐪'],['ح','حَاء','حِصَانٌ','🐴'],['خ','خَاء','خَرُوفٌ','🐑'],['د','دَال','دُبٌّ','🐻'],['ذ','ذَال','ذُرَةٌ','🌽'],['ر','رَاء','رَجُلٌ','👨'],['ز','زَاي','زَرَافَةٌ','🦒'],['س','سِين','سَمَكَةٌ','🐟'],['ش','شِين','شَمْسٌ','☀️'],['ص','صَاد','صَارُوخٌ','🚀'],['ض','ضَاد','ضِفْدَعٌ','🐸'],['ط','طَاء','طَائِرَةٌ','✈️'],['ظ','ظَاء','ظَرْفٌ','✉️'],['ع','عَيْن','عِنَبٌ','🍇'],['غ','غَيْن','غَيْمَةٌ','☁️'],['ف','فَاء','فِيلٌ','🐘'],['ق','قَاف','قَمَرٌ','🌙'],['ك','كَاف','كِتَابٌ','📖'],['ل','لَام','لَيْمُونٌ','🍋'],['م','مِيم','مَوْزٌ','🍌'],['ن','نُون','نَجْمَةٌ','⭐'],['ه','هَاء','هَدِيَّةٌ','🎁'],['و','وَاو','وَرْدَةٌ','🌹'],['ي','يَاء','يَدٌ','✋']];
const MENU=[['vL','أ ب ت','الحُرُوف'],['openS','🧩','المَقَاطِع'],['vW','🖼️','الكَلِمَات'],['vM','🎵','حُرُوفُ المَدِّ'],['vSe','📝','الجُمَل'],['vSt','📚','القِصَص'],['vC','🎨','التَّلْوِين'],['vG','🎮','الأَلْعَاب'],['vR','🎤','اِقْرَأْ وَأَنَا أَسْمَعُكَ']];
const SK=['ل','ن','ر','م','ب'],F='َ',D='ُ',K='ِ';
const M={'فَتْحَة':c=>c+F,'ضَمَّة':c=>c+D,'كَسْرَة':c=>c+K,'سُكُون':(c,i)=>c+F+(SK[i%5]==c?'ت':SK[i%5])+'ْ','مُتَنَوِّعَة':(c,i)=>c+[F,D,K][i%3],
'مَدُّ الأَلِف':c=>c+F+'ا','مَدُّ الوَاو':c=>c+D+'و','مَدُّ اليَاء':c=>c+K+'ي','مَدُّ مُتَنَوِّع':(c,i)=>[c+F+'ا',c+D+'و',c+K+'ي'][i%3]};
const SM=['فَتْحَة','ضَمَّة','كَسْرَة','مُتَنَوِّعَة','سُكُون'],LM=['مَدُّ الأَلِف','مَدُّ الوَاو','مَدُّ اليَاء','مَدُّ مُتَنَوِّع'];
const WG_OLD={'مَفْتُوحَة':[['جَ-مَل','🐪'],['قَ-مَر','🌙'],['وَ-لَد','👦'],['عَ-لَم','🏳️']],
'مَضْمُومَة':[['كُ-رَة','⚽'],['ذُ-رَة','🌽'],['دُ-بّ','🐻'],['حُو-ت','🐋']],
'مَكْسُورَة':[['عِ-نَب','🍇'],['قِ-طَّة','🐱'],['فِي-ل','🐘'],['كِ-تَاب','📖']],
'ثَلَاثَة مَقَاطِع':[['شَ-جَ-رَة','🌳'],['سَ-مَ-كَة','🐟'],['بَ-قَ-رَة','🐄'],['وَ-رَ-دَة','🌹'],['حَ-قِي-بَة','🎒'],['تُ-فَّا-حَة','🍎']],
'سَاكِنَة':[['شَمْ-س','☀️'],['نَجْ-مَة','⭐'],['زَهْ-رَة','🌷'],['كُرْ-سِي','🪑'],['عُصْ-فُور','🐦'],['مَدْ-رَ-سَة','🏫']]};
const WG={'الفَتْحَة':[['ذَ-هَ-بَ','🚶'],['جَ-لَ-سَ','🪑'],['كَ-تَ-بَ','✍️'],['فَ-تَ-حَ','🚪'],['رَ-سَ-مَ','🎨'],['قَ-فَ-زَ','🐸'],['سَ-بَ-حَ','🏊'],['حَ-مَ-لَ','🎒']],
'الضَّمَّة':[['فُ-تِ-حَ','🚪'],['كُ-تِ-بَ','✍️'],['رُ-سِ-مَ','🎨'],['حُ-مِ-لَ','🎒'],['شُ-رِ-بَ','🥤'],['سُ-مِ-عَ','👂']],
'الكَسْرَة':[['شَ-رِ-بَ','🥤'],['لَ-عِ-بَ','⚽'],['فَ-رِ-حَ','😄'],['سَ-مِ-عَ','👂'],['عَ-لِ-مَ','💡'],['حَ-زِ-نَ','😢']],
'مُتَنَوِّعَة':[['وَ-صَ-لَ','🚌'],['يَ-قِ-فُ','🧍'],['يَ-جِ-دُ','🔍'],['يَ-هَ-بُ','🎁'],['نَ-زَ-لَ','⬇️'],['سَ-قَ-طَ','🍂']],
'السُّكُون':[['يَكْ-تُ-بُ','✍️'],['يَذْ-هَ-بُ','🚶'],['يَلْ-عَ-بُ','⚽'],['يَرْ-سُ-مُ','🎨'],['يَشْ-رَ-بُ','🥤'],['يَسْ-بَ-حُ','🏊']]};
const SS=[['جُمَلٌ قَصِيرَةٌ',['الْوَلَدُ يَلْعَبُ.','أُحِبُّ أُمِّي.','الشَّمْسُ سَاطِعَةٌ.','الْقِطَّةُ تَشْرَبُ الْحَلِيبَ.','هَذَا كِتَابٌ جَمِيلٌ.']],
['جُمَلٌ طَوِيلَةٌ',['ذَهَبَ الْوَلَدُ إِلَى الْمَدْرَسَةِ صَبَاحًا وَهُوَ يَحْمِلُ حَقِيبَتَهُ.','فِي الْحَدِيقَةِ وُرُودٌ جَمِيلَةٌ وَطُيُورٌ تُغَرِّدُ عَلَى الْأَشْجَارِ.','تُحِبُّ سَارَةُ أَنْ تَقْرَأَ قِصَّةً جَمِيلَةً قَبْلَ النَّوْمِ.']]];
const ST=[['الأَرْنَبُ وَالجَزَرَةُ',[['🐰','#ffe0e9','رَأَى الْأَرْنَبُ جَزَرَةً كَبِيرَةً.'],['🥕','#ffeccc','قَفَزَ الْأَرْنَبُ فَرَحًا.'],['🏡','#dff7d9','أَكَلَ الْأَرْنَبُ الْجَزَرَةَ وَشَكَرَ أُمَّهُ.']]],
['السَّمَكَةُ الصَّغِيرَةُ',[['🐟','#cdeeff','تَسْبَحُ السَّمَكَةُ فِي الْبَحْرِ.'],['🐢','#d6f5e3','الْتَقَتْ بِصَدِيقَتِهَا السُّلَحْفَاةِ.'],['🌅','#ffe2c4','لَعِبَتَا مَعًا حَتَّى الْمَسَاءِ.']]],
['القِطَّةُ الجَائِعَةُ',[['🐱','#fff0c2','جَاعَتِ الْقِطَّةُ الصَّغِيرَةُ.'],['🥛','#e8ecff','وَجَدَتْ صَحْنًا مِنَ الْحَلِيبِ.'],['😴','#eadcff','شَرِبَتِ الْحَلِيبَ وَنَامَتْ سَعِيدَةً.']]]];
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.7;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ar'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const hd=(t,b=1)=>`<header>${b?'<button class="bk" onclick="home()">🏠</button>':''}<h1>${t}</h1><span class="st">⭐ <b id="sc">${st}</b></span></header>`;
function add(n){st+=n;const e=document.getElementById('sc');if(e)e.textContent=st}
const sh=a=>[...a].sort(()=>Math.random()-.5),rn=a=>a[Math.floor(Math.random()*a.length)];
function home(){A.innerHTML=hd('أَقْرَأُ وَأَتَعَلَّمُ',0)+'<p class="hi">اِخْتَرْ مُغَامَرَتَكَ!</p><div class="grid">'+MENU.map((m,i)=>`<button class="tile" style="--h:${i*45+5}" onclick="${m[0]}()"><i>${m[1]}</i>${m[2]}</button>`).join('')+'</div>'}
function vL(i=0){const l=LT[i],h=i*37;A.innerHTML=hd('الحُرُوف')+`<div class="big" style="--h:${h}"><div class="ltr" onclick="speak('${l[1]}')">${l[0]}</div><div class="nm">${l[1]} 🔊</div><div class="pic">${l[3]}</div><div class="wd" onclick="speak('${l[2]}')">${l[2]} 🔊</div><div class="fm">${[F,D,K].map(v=>`<b onclick="speak('${(l[0]=='أ'&&v==K?'إ':l[0])+v}')">${(l[0]=='أ'&&v==K?'إ':l[0])+v}</b>`).join('')}</div><div class="forms">${(NC.includes(l[0])?[['مُنْفَصِل',l[0]],['آخِر','ـ'+l[0]]]:[['مُنْفَصِل',l[0]],['أَوَّل',l[0]+'ـ'],['وَسَط','ـ'+l[0]+'ـ'],['آخِر','ـ'+l[0]]]).map(f=>`<div class="fo"><b>${f[1]}</b><small>${f[0]}</small></div>`).join('')}</div>${NC.includes(l[0])?'<div class="nt">حَرْفٌ لَا يَتَّصِلُ بِمَا بَعْدَهُ</div>':'<div class="nt" style="color:#2a9d8f">حَرْفٌ يَتَّصِلُ بِمَا بَعْدَهُ</div>'}</div><div class="chips">${LT.map((x,j)=>`<button class="chip${j==i?' on':''}" style="--h:${j*37}" onclick="vL(${j});add(0)">${x[0]}</button>`).join('')}</div>`;speak(l[1]+'. '+l[2])}
let CM=SM;
function vS(m,mods,t){if(mods){CM=mods;window.CT=t}m=m||CM[0];const L=LT.filter(x=>x[0]!='أ');
A.innerHTML=hd(window.CT||'المَقَاطِع')+`<div class="tabs">${CM.map(k=>`<button class="tab${k==m?' on':''}" onclick="vS('${k}')">${k}</button>`).join('')}</div><div class="cards">${L.map((x,i)=>{const s=M[m](x[0],i);return `<div class="cd" style="--h:${i*41}" onclick="speak('${s}')">${s}</div>`}).join('')}</div>`}
function vM(){vS(0,LM,'حُرُوفُ المَدِّ')}
function openS(){window.CT='المَقَاطِع';vS(0,SM,'المَقَاطِع')}
function vW(k){k=k||Object.keys(WG)[0];A.innerHTML=hd('الكَلِمَات')+`<div class="tabs">${Object.keys(WG).map(x=>`<button class="tab${x==k?' on':''}" onclick="vW('${x}')">${x}</button>`).join('')}</div><div class="cards">${WG[k].map((w,i)=>`<div class="cd wc" style="--h:${i*60}" onclick="speak('${w[0].replace(/-/g,'')}');add(0)"><span class="e">${w[1]}</span>${w[0].split('-').map((p,j)=>`<span class="s${j%3}">${p}</span>`).join('')}</div>`).join('')}</div>`}
const wordsHtml=t=>t.split(' ').map(w=>`<span class="w" onclick="speak(this.textContent)">${w}</span>`).join(' ');
function readS(id,t){const ws=[...document.querySelectorAll('#'+id+' .w')];speak(t);ws.forEach((w,i)=>setTimeout(()=>{ws.forEach(x=>x.classList.remove('hl'));w.classList.add('hl')},i*700));setTimeout(()=>ws.forEach(x=>x.classList.remove('hl')),ws.length*700)}
function vSe(){let n=0;A.innerHTML=hd('الجُمَل')+SS.map(g=>`<div class="sec">${g[0]}</div>`+g[1].map(s=>{n++;return `<div class="sent" id="s${n}">${wordsHtml(s)}<button class="rd" onclick="readS('s${n}','${s}');add(1)">🔊 اِسْمَعْ</button></div>`}).join('')).join('')}
let SI=0,PI=0;
function vSt(i,p){if(i==null){A.innerHTML=hd('القِصَص')+'<div class="grid">'+ST.map((s,k)=>`<button class="tile" style="--h:${k*80+10}" onclick="vSt(${k},0)"><i>${s[1][0][0]}</i>${s[0]}</button>`).join('')+'</div>';return}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
